name: Telegram Job Agent - offline checks

on:
  push:
    branches:
      - "recovery/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources without Telegram credentials
        run: python -m compileall -q worker.py seeker_poster.py scanner.py discover_sources.py selector.py channel_router.py outbound_policy.py
      - name: Install isolated test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run offline regression tests
        run: python -m pytest -q tests
